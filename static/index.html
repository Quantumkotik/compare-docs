<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сравнение двух документов .docx</title>
  <link rel="stylesheet" href="/static/styles.css?v=2">
</head>
<body>
  <header class="header">
    <h1>Сравнение документов</h1>
    <p class="subtitle">Загрузите старую и новую версию файла <code>.docx</code> —
      различия будут показаны рядом</p>
  </header>

  <main class="container">
    <form id="upload-form" class="drops">
      <label class="drop" data-slot="first">
        <input type="file" accept=".docx" hidden>
        <span class="drop__badge">Старая версия</span>
        <span class="drop__hint">Перетащите файл сюда или нажмите, чтобы выбрать</span>
        <span class="drop__file"></span>
        <button type="button" class="drop__clear" title="Убрать файл" hidden>×</button>
      </label>

      <label class="drop" data-slot="second">
        <input type="file" accept=".docx" hidden>
        <span class="drop__badge">Новая версия</span>
        <span class="drop__hint">Перетащите файл сюда или нажмите, чтобы выбрать</span>
        <span class="drop__file"></span>
        <button type="button" class="drop__clear" title="Убрать файл" hidden>×</button>
      </label>
    </form>

    <div class="actions">
      <button id="submit" class="btn btn--primary" disabled>Сравнить</button>
      <button id="reset" class="btn" type="button">Сбросить</button>
      <span id="status" class="status"></span>
    </div>

    <p id="error" class="error" hidden></p>

    <section id="summary" class="summary" hidden></section>

    <section id="results" class="results" hidden></section>
  </main>

  <script src="/static/app.js?v=2"></script>
</body>
</html>
