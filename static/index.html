<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>compare-docs</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="header">
    <h1>compare-docs</h1>
    <p class="subtitle">Загрузите две версии документа .docx, чтобы увидеть различия</p>
  </header>

  <main class="main">
    <form id="upload-form">
      <div class="dropzones">
        <label class="dropzone" data-slot="left">
          <input type="file" name="left" accept=".docx" hidden>
          <span class="dropzone__badge">Старая версия</span>
          <span class="dropzone__icon">＋</span>
          <span class="dropzone__label">Перетащите файл или нажмите</span>
          <span class="dropzone__file"></span>
        </label>

        <label class="dropzone" data-slot="right">
          <input type="file" name="right" accept=".docx" hidden>
          <span class="dropzone__badge">Новая версия</span>
          <span class="dropzone__icon">＋</span>
          <span class="dropzone__label">Перетащите файл или нажмите</span>
          <span class="dropzone__file"></span>
        </label>
      </div>

      <div class="actions">
        <button type="submit" id="submit-btn" disabled>Сравнить</button>
        <button type="button" id="reset-btn" class="secondary">Сбросить</button>
      </div>
    </form>

    <p id="error" class="error" hidden></p>

    <section id="results" class="results" hidden>
      <div class="summary">
        <div class="summary__stats" id="summary-stats"></div>
        <label class="toggle">
          <input type="checkbox" id="only-changes">
          <span>Только различия</span>
        </label>
      </div>

      <!-- Одна grid-сетка на обе колонки: строки-пары выравниваются по высоте -->
      <div class="diff" id="diff"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
